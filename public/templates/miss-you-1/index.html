<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A romantic love letter, recording every day we spend together">
  <meta name="author" content="qzydustin">
  <meta name="theme-color" content="#ffe">

  <!-- Open Graph -->
  <meta property="og:title" content="Love Letter">
  <meta property="og:description" content="A romantic love letter, recording every day we spend together">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://love.qzydustin.com">

  <!-- Title & Resources -->
  <title>Love Letter</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="config.js"></script>
</head>
<body>
  <!-- Background Music -->
  <audio loop id="bgm" preload="auto" aria-label="Background music">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
  
  <!-- Main Container -->
  <div id="viewport">
    <div id="main">
      <!-- Love Letter Content (moved into #mobile-content on narrow screens) -->
      <div id="letter" role="article"></div>
      
      <!-- Time Counter (moved into #mobile-content on narrow screens) -->
      <div id="clock-box" role="timer">
        <div id="clock-text"></div>
        <div id="clock"></div>
      </div>
      
      <!-- Ground Canvas -->
      <canvas id="ground-canvas" aria-hidden="true"></canvas>

      <!-- Static Canvas (tree) -->
      <canvas id="static-canvas" aria-hidden="true"></canvas>

      <!-- Dynamic Canvas (falling hearts) -->
      <canvas id="canvas" aria-label="Animated tree with hearts"></canvas>
    </div>
  </div>

  <!-- On phones, the letter + countdown get moved in here (see js/ui.js
       setupMobileLayout) so they read as a normal, always-legible block
       below the tree art instead of tiny text scaled with the canvas. -->
  <div id="mobile-content" aria-hidden="false"></div>
  
  <!-- Main Script -->
  <script src="js/geometry.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
<script>(function(){var on=false,btn;function ensure(){if(!btn){btn=document.createElement('button');btn.textContent='✏';btn.setAttribute('aria-label','Edit');btn.style.cssText='position:fixed;top:18px;right:18px;z-index:99999;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(30,20,30,.8);color:#fff;display:none;place-items:center;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);backdrop-filter:blur(10px);cursor:pointer';btn.onclick=function(){parent.postMessage({type:'BB_ELEMENT_SELECTED',selection:{key:'missYou',label:'Miss You template content',kind:'template'}},'*')};document.body.appendChild(btn)}btn.style.display=on?'grid':'none'}window.addEventListener('message',function(e){if(e.data&&e.data.type==='BB_EDITOR_MODE'){on=!!e.data.enabled;ensure()}});})();</script><script>(function(){function muteDemo(){try{document.querySelectorAll('audio,video').forEach(function(m){m.muted=true;m.volume=0;var p=m.pause();if(p&&typeof p.catch==='function')p.catch(function(){});});document.querySelectorAll('iframe').forEach(function(f){if(/youtube|vimeo/i.test(f.src||'')){try{f.contentWindow&&f.contentWindow.postMessage(JSON.stringify({event:'command',func:'mute',args:[]}),'*')}catch(_){}}});}catch(_){}}window.addEventListener('message',function(e){if(e&&e.data&&e.data.type==='BB_DEMO_MODE'&&e.data.enabled){muteDemo();setTimeout(muteDemo,200);setTimeout(muteDemo,1200);}});window.addEventListener('load',function(){if(new URLSearchParams(location.search).get('bbDemo')==='1')muteDemo();});})();</script><script>(function(){function playDemoAudio(){try{document.querySelectorAll('audio').forEach(function(a){a.muted=false;a.volume=a.volume>0?a.volume:0.45;a.play&&a.play().catch(function(){});});var btn=document.getElementById('soundBtn');if(btn){try{btn.click();}catch(_){}}var bgm=document.getElementById('bgm');if(bgm){bgm.muted=false;bgm.volume=bgm.volume>0?bgm.volume:0.35;bgm.play&&bgm.play().catch(function(){});}var bg=document.getElementById('backgroundMusic');if(bg){bg.muted=false;bg.volume=bg.volume>0?bg.volume:0.4;bg.play&&bg.play().catch(function(){});}if(typeof window.startAudio==='function'){try{window.startAudio();}catch(_){}}}catch(_){}}window.addEventListener('message',function(e){if(e&&e.data&&e.data.type==='BB_DEMO_PLAY_AUDIO')playDemoAudio();});})();</script></body>
</html>
